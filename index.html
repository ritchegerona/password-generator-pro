<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassGen Pro – Advanced Password Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css?v=3" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(-45deg, #0b1a2e, #1b3b4f, #2a5f6e, #1f3f4a);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-card {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 48px;
      padding: 2rem 2.2rem 2.5rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 8px 30px rgba(0,0,0,0.2),
                  inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .app-card:hover {
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
    }

    /* ----- HEADER ----- */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .app-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-header h1 i {
      font-size: 1.7rem;
      color: #ffd966;
      filter: drop-shadow(0 0 8px rgba(255, 217, 102, 0.3));
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-version {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.06);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 0.3rem 0.8rem;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    /* ----- PASSWORD DISPLAY ----- */
    .password-display {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 0.7rem 1.2rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: 0.2s;
      gap: 10px;
    }

    .password-display:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .password-text {
      font-size: 1.4rem;
      font-weight: 540;
      letter-spacing: 0.8px;
      color: #ffffff;
      font-family: 'SF Mono', 'Fira Code', monospace;
      word-break: break-all;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      flex: 1;
      min-width: 0;
    }

    .password-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      padding: 6px 12px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.primary {
      background: #ffd966;
      color: #0b1a2e;
      border: none;
    }

    .icon-btn.primary:hover {
      background: #ffe08a;
    }

    /* ----- MULTI-PASSWORD OUTPUT ----- */
    .multi-password-area {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }

    .multi-password-area.active {
      display: block;
    }

    .multi-password-area::-webkit-scrollbar {
      width: 4px;
    }
    .multi-password-area::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
    }
    .multi-password-area::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .pwd-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.4rem 0.8rem 0.4rem 1.2rem;
      border-radius: 40px;
      margin-bottom: 5px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: 0.15s;
    }

    .pwd-chip:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .pwd-chip .pwd-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.3px;
      word-break: break-all;
    }

    .pwd-chip .chip-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .pwd-chip .chip-actions button {
      background: rgba(255, 255, 255, 0.04);
      border: none;
      border-radius: 30px;
      padding: 2px 10px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.15s;
    }

    .pwd-chip .chip-actions button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .copy-all-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      padding: 0.2rem 1rem;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.15s;
      margin-top: 4px;
    }

    .copy-all-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* ----- ENTROPY + STRENGTH BAR ----- */
    .entropy-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 0 1.4rem 0;
      padding: 0 0.2rem;
    }

    .entropy-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .entropy-badge {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
    }

    .entropy-badge i {
      margin-right: 8px;
      color: #7ed4ad;
    }

    .strength-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.25rem 1.2rem;
      border-radius: 40px;
      background: rgba(126, 212, 173, 0.12);
      color: #7ed4ad;
      border: 1px solid rgba(126, 212, 173, 0.15);
      backdrop-filter: blur(4px);
    }

    /* Strength bar */
    .strength-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 2px;
    }

    .strength-bar {
      height: 100%;
      width: 78%;
      border-radius: 10px;
      transition: width 0.3s ease, background 0.3s ease;
      background: #7ed4ad;
    }

    /* ----- QUALITY CHECKMARKS ----- */
    .quality-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      margin: 0.4rem 0 1.2rem 0;
      padding: 0 0.2rem;
    }

    .quality-checks span {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }

    .quality-checks span.active {
      color: rgba(255, 255, 255, 0.85);
    }

    .quality-checks span i {
      font-size: 0.7rem;
    }

    .quality-checks span.active i {
      color: #7ed4ad;
    }

    /* ----- OPTIONS PANEL ----- */
    .options-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 1.4rem 1.8rem 1.6rem;
      margin-bottom: 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .length-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.4rem;
      flex-wrap: wrap;
      gap: 8px;
    }

    .length-label {
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
    }

    .length-control {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .length-value {
      font-weight: 600;
      font-size: 1.1rem;
      min-width: 2.4rem;
      text-align: center;
      color: #ffffff;
    }

    input[type="range"] {
      width: 150px;
      height: 5px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      outline: none;
      transition: 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #ffd966;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 217, 102, 0.3);
      border: 2px solid rgba(255,255,255,0.3);
      transition: 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      background: #ffe08a;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: #ffd966;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .char-options {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.8rem;
      margin-bottom: 1.2rem;
    }

    .char-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 450;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: 0.1s;
    }

    .char-options label:hover {
      color: #ffffff;
    }

    .char-options input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #ffd966;
      border-radius: 6px;
      cursor: pointer;
      filter: drop-shadow(0 0 4px rgba(255, 217, 102, 0.15));
    }

    .custom-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 0.2rem;
    }

    .custom-row span {
      font-weight: 450;
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }

    .custom-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      flex: 1;
      min-width: 110px;
      outline: none;
      transition: 0.2s;
      color: #ffffff;
      backdrop-filter: blur(4px);
    }

    .custom-input:focus {
      border-color: #ffd966;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(255, 217, 102, 0.06);
    }

    .custom-input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.5rem;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    @media (max-width: 500px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 0.6rem;
      }
    }

    .options-grid label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: 0.1s;
    }

    .options-grid label:hover {
      color: #ffffff;
    }

    .options-grid input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ffd966;
      cursor: pointer;
    }

    .sep-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sep-control span {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }

    .sep-control input[type="text"] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 0.2rem 0.8rem;
      width: 50px;
      text-align: center;
      font-size: 0.9rem;
      outline: none;
      color: #ffffff;
      transition: 0.2s;
    }

    .sep-control input[type="text"]:focus {
      border-color: #ffd966;
      background: rgba(255, 255, 255, 0.08);
    }

    .sep-control input[type="number"] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 0.2rem 0.4rem;
      width: 48px;
      text-align: center;
      font-size: 0.8rem;
      outline: none;
      color: #ffffff;
      transition: 0.2s;
    }

    .sep-control input[type="number"]:focus {
      border-color: #ffd966;
      background: rgba(255, 255, 255, 0.08);
    }

    .count-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 0.3rem 0.8rem;
      width: 70px;
      text-align: center;
      font-size: 0.9rem;
      outline: none;
      color: #ffffff;
      transition: 0.2s;
    }

    .count-input:focus {
      border-color: #ffd966;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ----- ACTIONS ----- */
    .actions {
      display: flex;
      gap: 14px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.85rem 0.4rem;
      border-radius: 60px;
      font-weight: 550;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 100px;
    }

    .btn-primary {
      background: #ffd966;
      color: #0b1a2e;
      border: none;
      box-shadow: 0 8px 24px rgba(255, 217, 102, 0.2);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #ffe08a;
      transform: scale(0.97);
      box-shadow: 0 12px 32px rgba(255, 217, 102, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.94);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .btn i {
      font-size: 1rem;
    }

    /* ----- HISTORY ----- */
    .history-section {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 1.2rem 1.5rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 6px;
    }

    .history-header span {
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      letter-spacing: 0.2px;
    }

    .history-header .hdr-actions {
      display: flex;
      gap: 6px;
    }

    .history-header .hdr-actions button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      transition: 0.15s;
      backdrop-filter: blur(4px);
    }

    .history-header .hdr-actions button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .history-item .h-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .history-item .h-item-left .pin-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.15);
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.15s;
    }

    .history-item .h-item-left .pin-btn:hover {
      color: rgba(255, 255, 255, 0.5);
    }
    .history-item .h-item-left .pin-btn.pinned {
      color: #ffd966;
    }

    .history-item .h-item-left .pwd-text {
      word-break: break-all;
    }

    .history-item small {
      font-family: system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.6rem;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .history-empty {
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.85rem;
      padding: 0.4rem 0.2rem;
      font-style: italic;
    }

    .footer-tag {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
    }

    .strong-badge {
      background: rgba(126, 212, 173, 0.06);
      color: #7ed4ad;
      font-weight: 600;
      font-size: 0.6rem;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      text-transform: uppercase;
      border: 1px solid rgba(126, 212, 173, 0.08);
      backdrop-filter: blur(4px);
    }

    /* Keyboard shortcut hint */
    .shortcut-hint {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.15);
      margin-top: 0.3rem;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .shortcut-hint kbd {
      background: rgba(255,255,255,0.04);
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.04);
      font-family: monospace;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .app-card { padding: 1.5rem; }
      .char-options { gap: 0.6rem 1rem; }
      .length-row { flex-wrap: wrap; gap: 8px; }
      .password-text { font-size: 1.1rem; }
      .actions { flex-direction: column; }
      .custom-row { flex-wrap: wrap; }
      .options-grid { grid-template-columns: 1fr; }
      .header-actions .badge-version span { display: none; }
    }
    /* Toast notification styles */
    .toast-container {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
    }
    .toast {
      min-width: 200px;
      padding: 0.6rem 1rem;
      border-radius: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.7);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .toast.success { background: rgba(0,128,0,0.8); }
    .toast.error { background: rgba(200,0,0,0.8); }
    .toast .close-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .toast .close-btn:hover { opacity: 0.7; }
    </style>
</head>
<body>
  <div class="app-card">

    <!-- HEADER -->
    <div class="app-header">
      <h1><i class="fas fa-key"></i> PassGen Pro</h1>
      <div class="header-actions">
        <span class="badge-version"><i class="fas fa-crown" style="font-size: 0.6rem;"></i> <span>v3.0</span></span>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (coming soon)"><i class="fas fa-moon"></i></button>
      </div>
    </div>

    <!-- PASSWORD DISPLAY -->
    <div class="password-display">
      <span class="password-text" id="passwordDisplay">BMc2twj&t4$U</span>
      <div class="password-actions">
        <button class="icon-btn" id="regenerateBtn" title="Regenerate (Ctrl+Enter)"><i class="fas fa-sync-alt"></i></button>
        <button class="icon-btn primary" id="copyBtn"><i class="far fa-copy"></i> <span style="font-size:0.7rem;font-weight:500;">copy</span></button>
      </div>
    </div>

    <!-- MULTI-PASSWORD OUTPUT -->
    <div class="multi-password-area" id="multiPwdArea">
      <div id="multiPwdList"></div>
      <button class="copy-all-btn" id="copyAllBtn"><i class="far fa-copy"></i> Copy all</button>
    </div>

    <!-- ENTROPY + STRENGTH BAR -->
    <div class="entropy-row">
      <div class="entropy-top">
        <span class="entropy-badge"><i class="fas fa-shield-alt"></i> Entropy: <span id="entropyValue">78</span> bits</span>
        <span class="strength-tag" id="strengthTag"><i class="fas fa-check-circle" style="margin-right:6px;"></i> Strong</span>
      </div>
      <div class="strength-bar-container">
        <div class="strength-bar" id="strengthBar" style="width:78%; background:#7ed4ad;"></div>
      </div>
    </div>

    <!-- QUALITY CHECKS -->
    <div class="quality-checks" id="qualityChecks">
      <span id="qLower"><i class="fas fa-circle"></i> Lowercase</span>
      <span id="qUpper"><i class="fas fa-circle"></i> Uppercase</span>
      <span id="qDigits"><i class="fas fa-circle"></i> Digits</span>
      <span id="qSymbols"><i class="fas fa-circle"></i> Symbols</span>
      <span id="qLength"><i class="fas fa-circle"></i> Length ≥ 12</span>
    </div>

    <!-- OPTIONS PANEL -->
    <div class="options-panel">
      <!-- Length -->
      <div class="length-row">
        <span class="length-label"><i class="fas fa-arrows-alt-h" style="margin-right:10px;opacity:0.4;"></i>Length</span>
        <div class="length-control">
          <span class="length-value" id="lengthValue">12</span>
          <input type="range" id="lengthSlider" min="6" max="40" value="12">
        </div>
      </div>

      <!-- Character sets -->
      <div class="char-options">
        <label><input type="checkbox" id="chkLower" checked> a-z</label>
        <label><input type="checkbox" id="chkUpper" checked> A-Z</label>
        <label><input type="checkbox" id="chkDigits" checked> 0-9</label>
        <label><input type="checkbox" id="chkSymbols" checked> @#%</label>
      </div>

      <!-- Custom -->
      <div class="custom-row">
        <span><i class="fas fa-pen" style="margin-right:6px;opacity:0.4;"></i>Custom:</span>
        <input class="custom-input" id="customChars" type="text" placeholder="!@#..." value="!@#$%^&*">
        <span style="font-size:0.8rem;opacity:0.4;margin-left:auto;">Count:</span>
        <input class="count-input" id="countInput" type="number" value="1" min="1" max="20">
      </div>

      <!-- Grid options -->
      <div class="options-grid">
        <label><input type="checkbox" id="chkExcludeSimilar"> Exclude similar <span style="font-size:0.65rem;opacity:0.4;">(il1Lo0O)</span></label>
        <label><input type="checkbox" id="chkPronounceable"> Pronounceable</label>
        <label><input type="checkbox" id="chkAutoCopy"> Auto-copy on generate</label>
        <label><input type="checkbox" id="chkEnforceAll"> Enforce all char sets</label>
        <div class="sep-control">
          <span>Separator:</span>
          <input type="text" id="separatorInput" placeholder="-" value="-">
          <span>every</span>
          <input type="number" id="sepInterval" value="4" min="2" max="8">
          <span style="font-size:0.65rem;opacity:0.4;">chars</span>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="btn btn-primary" id="generateBtn"><i class="fas fa-sync-alt"></i> Generate</button>
      <button class="btn btn-outline" id="easyBtn"><i class="fas fa-star"></i> Easy</button>
      <button class="btn btn-outline" id="clearHistoryBtn"><i class="fas fa-trash-alt"></i> Clear</button>
    </div>

    <!-- HISTORY -->
    <div class="history-section">
      <div class="history-header">
        <span><i class="fas fa-clock" style="margin-right:8px;opacity:0.3;"></i>History <span id="historyCount" style="font-weight:300;opacity:0.4;margin-left:6px;">(1)</span></span>
        <div class="hdr-actions">
          <button id="exportHistoryBtn"><i class="fas fa-download"></i> Export</button>
          <button id="clearPinnedBtn" style="display:none;"><i class="fas fa-thumbtack"></i> Pinned</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-item">
          <div class="h-item-left">
            <button class="pin-btn" data-pwd="BMc2twj&t4$U"><i class="fas fa-thumbtack"></i></button>
            <span class="pwd-text">BMc2twj&t4$U</span>
          </div>
          <small>just now</small>
        </div>
      </div>
      <div class="footer-tag">
        <span class="strong-badge"><i class="fas fa-lock"></i> secure</span>
      </div>
    </div>

    <div class="shortcut-hint">
      <kbd>Ctrl+Enter</kbd> generate · <kbd>Ctrl+C</kbd> copy
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    (function() {
      // ---- DOM refs ----
      const passwordDisplay = document.getElementById('passwordDisplay');
      const lengthSlider = document.getElementById('lengthSlider');
      const lengthValue = document.getElementById('lengthValue');
      const chkLower = document.getElementById('chkLower');
      const chkUpper = document.getElementById('chkUpper');
      const chkDigits = document.getElementById('chkDigits');
      const chkSymbols = document.getElementById('chkSymbols');
      const customCharsInput = document.getElementById('customChars');
      const countInput = document.getElementById('countInput');
      const separatorInput = document.getElementById('separatorInput');
      const sepInterval = document.getElementById('sepInterval');
      const chkExcludeSimilar = document.getElementById('chkExcludeSimilar');
      const chkPronounceable = document.getElementById('chkPronounceable');
      const chkAutoCopy = document.getElementById('chkAutoCopy');
      const chkEnforceAll = document.getElementById('chkEnforceAll');
      const generateBtn = document.getElementById('generateBtn');
      const regenerateBtn = document.getElementById('regenerateBtn');
      const easyBtn = document.getElementById('easyBtn');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const copyBtn = document.getElementById('copyBtn');
      const copyAllBtn = document.getElementById('copyAllBtn');

      function showToast(message, type='info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span>${message}</span><button class="close-btn">&times;</button>`;
        const closeBtn = toast.querySelector('.close-btn');
        closeBtn.addEventListener('click', () => container.removeChild(toast));
        container.appendChild(toast);
      }
      const entropyValue = document.getElementById('entropyValue');
      const strengthTag = document.getElementById('strengthTag');
      const strengthBar = document.getElementById('strengthBar');
      const historyList = document.getElementById('historyList');
      const historyCount = document.getElementById('historyCount');
      const exportBtn = document.getElementById('exportHistoryBtn');
      const multiPwdArea = document.getElementById('multiPwdArea');
      const multiPwdList = document.getElementById('multiPwdList');
      const qualityChecks = {
        lower: document.getElementById('qLower'),
        upper: document.getElementById('qUpper'),
        digits: document.getElementById('qDigits'),
        symbols: document.getElementById('qSymbols'),
        length: document.getElementById('qLength'),
      };

      // ---- State ----
      let history = ['BMc2twj&t4$U'];
      let pinned = new Set();
      let currentPasswords = ['BMc2twj&t4$U'];

      // ---- Helpers ----
      function getCharSet() {
        let chars = '';
        if (chkLower.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
        if (chkUpper.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (chkDigits.checked) chars += '0123456789';
        if (chkSymbols.checked) chars += '@#%';
        const custom = customCharsInput.value || '';
        if (custom) chars += custom;

        if (chkExcludeSimilar.checked) {
          const similar = 'il1Lo0O';
          chars = chars.split('').filter(c => !similar.includes(c)).join('');
        }
        return chars;
      }

      function getSelectedSets() {
        const sets = [];
        if (chkLower.checked) sets.push('abcdefghijklmnopqrstuvwxyz');
        if (chkUpper.checked) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
        if (chkDigits.checked) sets.push('0123456789');
        if (chkSymbols.checked) sets.push('@#%');
        const custom = customCharsInput.value || '';
        if (custom) sets.push(custom);
        return sets;
      }

      function generatePronounceable(length) {
        const vowels = 'aeiou';
        const consonants = 'bcdfghjklmnpqrstvwxyz';
        let pwd = '';
        for (let i = 0; i < length; i++) {
          pwd += (i % 2 === 0)
            ? consonants[Math.floor(Math.random() * consonants.length)]
            : vowels[Math.floor(Math.random() * vowels.length)];
        }
        return pwd;
      }

      function generatePassword(length) {
        if (chkPronounceable.checked) {
          return generatePronounceable(length);
        }

        const charset = getCharSet();
        if (!charset) return '⚠️ no chars';

        const enforceAll = chkEnforceAll.checked;
        const sets = getSelectedSets().filter(s => s.length > 0);

        if (enforceAll && sets.length > 1) {
          // Build password with at least one from each set
          let pwd = '';
          const remaining = [];
          for (const set of sets) {
            const idx = Math.floor(Math.random() * set.length);
            pwd += set[idx];
            // remove used char from set for remaining pool
            const remainingSet = set.slice(0, idx) + set.slice(idx + 1);
            if (remainingSet) remaining.push(remainingSet);
          }
          // Fill rest from combined pool
          const combined = sets.join('');
          for (let i = pwd.length; i < length; i++) {
            pwd += combined[Math.floor(Math.random() * combined.length)];
          }
          // Shuffle
          return pwd.split('').sort(() => Math.random() - 0.5).join('');
        }

        let password = '';
        for (let i = 0; i < length; i++) {
          password += charset[Math.floor(Math.random() * charset.length)];
        }
        return password;
      }

      function applySeparator(password, separator, interval) {
        if (!separator || separator.trim() === '') return password;
        const sep = separator.trim();
        const intv = parseInt(interval) || 4;
        if (intv < 1) return password;
        let result = '';
        for (let i = 0; i < password.length; i++) {
          if (i > 0 && i % intv === 0) result += sep;
          result += password[i];
        }
        return result;
      }

      function estimateEntropy(password) {
        const set = getCharSet();
        const poolSize = set.length || 1;
        return Math.round(Math.log2(poolSize) * password.length);
      }

      function getStrengthData(bits) {
        if (bits >= 70) return { label: 'Strong', color: '#7ed4ad', width: Math.min(100, bits) };
        if (bits >= 40) return { label: 'Medium', color: '#f5c542', width: Math.min(100, bits) };
        return { label: 'Weak', color: '#e67e7e', width: Math.max(10, bits) };
      }

      function updateQualityChecks(password) {
        const checks = {
          lower: /[a-z]/.test(password),
          upper: /[A-Z]/.test(password),
          digits: /[0-9]/.test(password),
          symbols: /[^a-zA-Z0-9]/.test(password),
          length: password.length >= 12,
        };

        const labels = {
          lower: qualityChecks.lower,
          upper: qualityChecks.upper,
          digits: qualityChecks.digits,
          symbols: qualityChecks.symbols,
          length: qualityChecks.length,
        };

        for (const [key, el] of Object.entries(labels)) {
          if (checks[key]) {
            el.classList.add('active');
            el.innerHTML = `<i class="fas fa-check-circle"></i> ${key === 'lower' ? 'Lowercase' : key === 'upper' ? 'Uppercase' : key === 'digits' ? 'Digits' : key === 'symbols' ? 'Symbols' : 'Length ≥ 12'}`;
          } else {
            el.classList.remove('active');
            el.innerHTML = `<i class="fas fa-circle"></i> ${key === 'lower' ? 'Lowercase' : key === 'upper' ? 'Uppercase' : key === 'digits' ? 'Digits' : key === 'symbols' ? 'Symbols' : 'Length ≥ 12'}`;
          }
        }
      }

      function renderHistory() {
        historyList.innerHTML = '';
        if (history.length === 0) {
          historyList.innerHTML = '<div class="history-empty">No passwords yet</div>';
          historyCount.textContent = '(0)';
          return;
        }
        historyCount.textContent = `(${history.length})`;
        const reversed = [...history].reverse();
        for (const pwd of reversed) {
          const div = document.createElement('div');
          div.className = 'history-item';
          const isPinned = pinned.has(pwd);
          div.innerHTML = `
            <div class="h-item-left">
              <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-pwd="${pwd}"><i class="fas fa-thumbtack"></i></button>
              <span class="pwd-text">${pwd}</span>
            </div>
            <small>${isPinned ? '📌 pinned' : new Date().toLocaleTimeString()}</small>
          `;
          historyList.appendChild(div);
        }

        // Pin button events
        document.querySelectorAll('.pin-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const pwd = this.dataset.pwd;
            if (pinned.has(pwd)) {
              pinned.delete(pwd);
            } else {
              pinned.add(pwd);
            }
            renderHistory();
          });
        });
      }

      function renderMultiPasswords(passwords, separator, interval) {
        if (!passwords || passwords.length <= 1) {
          multiPwdArea.classList.remove('active');
          return;
        }
        multiPwdArea.classList.add('active');
        multiPwdList.innerHTML = '';
        for (const pwd of passwords) {
          const display = applySeparator(pwd, separator, interval);
          const chip = document.createElement('div');
          chip.className = 'pwd-chip';
          chip.innerHTML = `
            <span class="pwd-text">${display}</span>
            <div class="chip-actions">
              <button class="chip-copy" data-pwd="${pwd}"><i class="far fa-copy"></i> copy</button>
            </div>
          `;
          multiPwdList.appendChild(chip);
        }

        // Chip copy buttons
        document.querySelectorAll('.chip-copy').forEach(btn => {
          btn.addEventListener('click', function() {
            const pwd = this.dataset.pwd;
            navigator.clipboard.writeText(pwd).then(() => {
              const orig = this.innerHTML;
              this.innerHTML = '<i class="fas fa-check"></i> done';
              setTimeout(() => { this.innerHTML = orig; }, 1200);
            }).catch(() => {
              const el = document.createElement('textarea');
              el.value = pwd;
              document.body.appendChild(el);
              el.select();
              document.execCommand('copy');
              document.body.removeChild(el);
              const orig = this.innerHTML;
              this.innerHTML = '<i class="fas fa-check"></i> done';
              setTimeout(() => { this.innerHTML = orig; }, 1200);
            });
          });
        });
      }

      function updateUI(password, allPasswords) {
        const separator = separatorInput.value || '';
        const interval = parseInt(sepInterval.value) || 4;
        const display = applySeparator(password, separator, interval);
        passwordDisplay.textContent = display;

        const bits = estimateEntropy(password);
        entropyValue.textContent = bits;
        const strength = getStrengthData(bits);
        strengthTag.innerHTML = `<i class="fas fa-check-circle" style="margin-right:6px;"></i> ${strength.label}`;
        strengthTag.style.color = strength.color;
        strengthTag.style.borderColor = strength.color + '40';
        strengthTag.style.background = strength.color + '12';
        strengthBar.style.width = strength.width + '%';
        strengthBar.style.background = strength.color;

        updateQualityChecks(password);

        // Store in history
        if (!history.includes(password)) {
          history.push(password);
          if (history.length > 50) history.shift();
        }
        renderHistory();

        // Multi-password
        if (allPasswords && allPasswords.length > 1) {
          renderMultiPasswords(allPasswords, separator, interval);
        } else {
          multiPwdArea.classList.remove('active');
        }
        currentPasswords = allPasswords || [password];
      }

      function generateAndUpdate() {
        const length = parseInt(lengthSlider.value, 10);
        const count = parseInt(countInput.value, 10) || 1;
        const passwords = [];
        for (let i = 0; i < count; i++) {
          passwords.push(generatePassword(length));
        }
        const primary = passwords[0] || '⚠️ error';
        updateUI(primary, passwords);

        // Auto-copy
        if (chkAutoCopy.checked && passwords.length > 0) {
          const toCopy = passwords.length === 1 ? passwords[0] : passwords.join('\n');
          navigator.clipboard.writeText(toCopy).catch(() => {
            const el = document.createElement('textarea');
            el.value = toCopy;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
          });
        }

        lengthValue.textContent = length;
      }

      // ---- Event listeners ----
      generateBtn.addEventListener('click', generateAndUpdate);
      regenerateBtn.addEventListener('click', generateAndUpdate);

      easyBtn.addEventListener('click', function() {
        lengthSlider.value = 8;
        lengthValue.textContent = '8';
        chkLower.checked = true;
        chkUpper.checked = false;
        chkDigits.checked = true;
        chkSymbols.checked = false;
        customCharsInput.value = '';
        chkExcludeSimilar.checked = false;
        chkPronounceable.checked = false;
        chkEnforceAll.checked = false;
        separatorInput.value = '';
        sepInterval.value = '4';
        generateAndUpdate();
      });

      clearHistoryBtn.addEventListener('click', function() {
        if (history.length > 0) {
          // Keep pinned passwords
          const pinnedPasswords = Array.from(pinned);
          if (pinnedPasswords.length > 0) {
            history = pinnedPasswords;
          } else {
            history = [];
          }
          renderHistory();
          showToast('History cleared', 'success');
          if (history.length === 0) {
            passwordDisplay.textContent = '—';
            entropyValue.textContent = '0';
            strengthTag.innerHTML = '<i class="fas fa-minus-circle" style="margin-right:6px;"></i> None';
            strengthTag.style.color = '#888';
            strengthTag.style.borderColor = '#88840';
            strengthTag.style.background = '#88812';
            strengthBar.style.width = '0%';
            multiPwdArea.classList.remove('active');
          }
        }
      });

      copyBtn.addEventListener('click', function() {
        const pwd = passwordDisplay.textContent;
        if (pwd && pwd !== '—') {
          navigator.clipboard.writeText(pwd).then(() => {
            const orig = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> <span style="font-size:0.7rem;font-weight:500;">copied</span>';
            setTimeout(() => { copyBtn.innerHTML = orig; }, 1600);
            showToast('Password copied', 'success');
          }).catch(() => {
            const el = document.createElement('textarea');
            el.value = pwd;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            const orig = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> <span style="font-size:0.7rem;font-weight:500;">copied</span>';
            setTimeout(() => { copyBtn.innerHTML = orig; }, 1600);
            showToast('Password copied (fallback)', 'success');
          });
        }
      });

      copyAllBtn.addEventListener('click', function() {
        const pwds = currentPasswords;
        if (pwds && pwds.length > 1) {
          const text = pwds.join('\n');
          navigator.clipboard.writeText(text).catch(() => {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
          });
          const orig = copyAllBtn.innerHTML;
          copyAllBtn.innerHTML = '<i class="fas fa-check"></i> copied!';
          setTimeout(() => { copyAllBtn.innerHTML = orig; }, 1500);
          showToast('Passwords copied', 'success');
        }
      });

      // Auto-update on option changes
      const autoUpdate = () => generateAndUpdate();
      chkLower.addEventListener('change', autoUpdate);
      chkUpper.addEventListener('change', autoUpdate);
      chkDigits.addEventListener('change', autoUpdate);
      chkSymbols.addEventListener('change', autoUpdate);
      customCharsInput.addEventListener('input', autoUpdate);
      lengthSlider.addEventListener('change', autoUpdate);
      countInput.addEventListener('change', autoUpdate);
      separatorInput.addEventListener('input', autoUpdate);
      sepInterval.addEventListener('change', autoUpdate);
      chkExcludeSimilar.addEventListener('change', autoUpdate);
      chkPronounceable.addEventListener('change', autoUpdate);
      chkEnforceAll.addEventListener('change', autoUpdate);

      lengthSlider.addEventListener('input', function() {
        lengthValue.textContent = this.value;
      });

      // Export
      exportBtn.addEventListener('click', function() {
        if (history.length === 0) return;
        const data = history.join('\n');
        const blob = new Blob([data], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `passwords_${new Date().toISOString().slice(0,10)}.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          generateAndUpdate();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
          // Only if focused on password display or not in input
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            const pwd = passwordDisplay.textContent;
            if (pwd && pwd !== '—') {
              navigator.clipboard.writeText(pwd).catch(() => {});
            }
          }
        }
      });

      // Theme toggle (placeholder)
      document.getElementById('themeToggle').addEventListener('click', function() {
        this.innerHTML = this.innerHTML.includes('moon') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        // For demo, just visual feedback
      });

      // ---- Init ----
      (function init() {
        const initPwd = passwordDisplay.textContent;
        if (initPwd && initPwd !== 'BMc2twj&t4$U' && initPwd !== '—') {
          updateUI(initPwd, [initPwd]);
        } else {
